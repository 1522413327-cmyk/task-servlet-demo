name: CI

# ============================================================================
# 实验环节一：持续集成流水线
#
#   质量门禁 test  ──►  构建归档 package
#
# 设计要点（答辩时要能讲清楚）：
#   1. 两个 job 而不是两个 step：test 失败时 package 根本不会启动，
#      「测试不过就不产出构建物」这条规则由流水线结构保证，不靠人自觉。
#   2. 不声明 MySQL service：本项目 109 个测试全是 JUnit5 + Mockito 纯单元测试，
#      没有 @SpringBootTest，不需要真实数据库，因此流水线不需要任何外部依赖，
#      单次运行约 1 分钟。
#   3. JDK 固定 21：pom.xml 的 java.version=21，用 17 会直接编译失败。
#      （实验指导书写的是「JDK 17 等」，本项目实际要求更高，以 pom 为准。）
#   4. 产物用 actions/upload-artifact 归档，任何人下载即可 java -jar 启动，
#      这就是「可交付的构建物」，替代过去「在我电脑上能跑」的口头承诺。
# ============================================================================

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:          # 允许在网页上手动触发，便于演示

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true    # 同一分支连续 push 时取消上一轮，省额度

jobs:
  # ---------------------------------------------------------------- 质量门禁
  test:
    name: 质量门禁（单元测试 + 覆盖率）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: 单元测试与覆盖率（mvn clean test）
        run: mvn -B -ntp clean test

      - name: 归档 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14

  # ---------------------------------------------------------------- 构建归档
  package:
    name: 构建可执行 Jar 并归档
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test               # 门禁不过，这里不会执行
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: 打包（mvn package -DskipTests）
        run: mvn -B -ntp package -DskipTests

      - name: 校验产物已生成
        run: |
          test -f target/task-servlet-demo.jar || { echo "构建产物缺失"; exit 1; }
          ls -lh target/task-servlet-demo.jar

      - name: 归档构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: task-servlet-demo-jar
          path: target/task-servlet-demo.jar
          retention-days: 14
