# ===== prod：生产环境，敏感信息一律由外部注入，不写任何默认值 =====
# 缺少 DB_URL / DB_USERNAME / DB_PASSWORD 时启动即失败，
# 避免「忘记改配置就误连开发库」这类事故。
server:
  port: 8080

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 10
      max-active: 50
      min-idle: 10
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
  thymeleaf:
    cache: true               # 生产开启模板缓存

logging:
  level:
    root: warn
    cn.edu.mju.band.mapper: warn

app:
  task:
    default-page-size: 10
    max-page-size: 50
