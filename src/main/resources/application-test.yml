# ===== test：联调 / 演示环境，与开发库隔离，日志收敛 =====
# 切换验证：
#   mvn spring-boot:run -Dspring-boot.run.arguments=--spring.profiles.active=test
# 启动日志应出现 "The following 1 profile is active: test"，且端口为 8089。
# initial-size: 0 让启动阶段不预建连接 —— 即使本机没有建 taskmaster_test 库，
# 也能完整验证「命令行切换环境」这一步不报错。
server:
  port: 8089

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskmaster_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 0
      max-active: 10
      min-idle: 0
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: false

logging:
  level:
    root: warn
    cn.edu.mju.band: debug
    cn.edu.mju.band.mapper: debug

# 故意与 dev 不同，用来证明业务参数确实随环境切换（列表每页条数由 5 变 3）
app:
  task:
    default-page-size: 3
    max-page-size: 20
