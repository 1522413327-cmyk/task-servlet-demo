<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background: #f5f5f5; }
        .box { width: 320px; margin: 120px auto; padding: 24px;
               background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .box h2 { text-align: center; margin-bottom: 20px; }
        .row { margin-bottom: 14px; }
        .row label { display: block; margin-bottom: 6px; }
        .row input { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 9px; background: #2d8cf0; color: #fff;
               border: none; border-radius: 4px; cursor: pointer; }
        .tip { color: #999; font-size: 12px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
<div class="box">
    <h2>用户登录</h2>
    <!-- th:action 会自动带上应用上下文路径，替代原来的 ${pageContext.request.contextPath} -->
    <form th:action="@{/login}" method="post">
        <div class="row">
            <label>账号</label>
            <input type="text" name="username" required/>
        </div>
        <div class="row">
            <label>密码</label>
            <input type="password" name="password" required/>
        </div>
        <div class="row">
            <button class="btn" type="submit">登 录</button>
        </div>
    </form>
    <div class="tip">默认测试账号：admin / 123456</div>
</div>
</body>
</html>
