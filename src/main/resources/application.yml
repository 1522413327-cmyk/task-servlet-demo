# ==============================================================================
# 主配置：只保留所有环境共用的部分
# 环境差异（端口 / 数据源 / 日志等级 / 业务参数）拆到：
#   application-dev.yml / application-test.yml / application-prod.yml
#
# 切换环境（命令行参数优先级高于本文件的 active）：
#   java -jar target/task-servlet-demo.jar --spring.profiles.active=test
#   mvn spring-boot:run -Dspring-boot.run.arguments=--spring.profiles.active=test
#   IDEA: Run Configuration -> Active profiles = test
# ==============================================================================
spring:
  application:
    name: task-servlet-demo
  profiles:
    active: dev                 # 默认开发环境

  # 视图层：Thymeleaf 替代 JSP（prod 会把 cache 覆盖成 true）
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

# MyBatis-Plus：前缀必须是 mybatis-plus，MP 的自动配置只读这里
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.edu.mju.band.entity
  configuration:
    map-underscore-to-camel-case: true

# 业务参数公共默认值；各环境在 application-{profile}.yml 中覆盖，
# 由 TaskBuss / TaskController 的 @Value 读取，切换 profile 即生效
app:
  task:
    default-page-size: 5
    max-page-size: 100

# ===== 实验环节二：接口文档 =====
# springdoc 扫描 Controller 注解生成 OpenAPI 3 描述，并自带 Swagger UI。
# 两个地址（都不受登录拦截器保护，未登录也能查看文档）：
#   http://localhost:8088/swagger-ui/index.html  Swagger UI 交互界面（答辩演示用这个）
#   http://localhost:8088/v3/api-docs            OpenAPI 3 JSON（可导入 Postman / Apifox）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html        # 访问 /swagger-ui.html 会自动跳到 /swagger-ui/index.html
    tags-sorter: alpha            # 标签按字母序，界面稳定不跳动
    operations-sorter: method     # 同一标签内按 GET/POST/PUT/DELETE 排序
  default-produces-media-type: application/json
